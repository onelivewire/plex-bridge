name: beta checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Publish the tested bundle from an exact version tag (maintainer only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source manifest
        run: python3 tools/check_release.py .
      - name: Unit, HTTP, and real-browser checks
        env:
          PYTHONPATH: .
          BRIDGE_BROWSER: /usr/bin/google-chrome
        run: |
          test -x "$BRIDGE_BROWSER"
          python3 -m unittest discover -s tests
      - name: Source secret scan
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /src --config /src/.gitleaks.toml --redact --max-decode-depth 3
      - name: Fresh install, restart, and restore
        run: python3 tests/container_acceptance.py . pb-acceptance-ci
      - name: Single-container install, child failure, restart and restore
        run: python3 tests/bundle_acceptance.py . pb-acceptance-ci
      - name: Image vulnerability and secret scans
        run: |
          for service in setup topology playback bundle; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.76.0 image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 "pb-acceptance-ci-$service"
          done
      - name: Export all image layers for secret scan
        run: |
          docker save -o /tmp/bridge-images.tar pb-acceptance-ci-setup pb-acceptance-ci-topology pb-acceptance-ci-playback pb-acceptance-ci-bundle
          docker save -o /tmp/bridge-bundle.tar pb-acceptance-ci-bundle
          python3 tools/extract_image_layers.py /tmp/bridge-images.tar /tmp/bridge-image-scan
          docker run --rm -v /tmp/bridge-image-scan:/src:ro -v "$PWD/.gitleaks.toml:/scan-config.toml:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /src --config /scan-config.toml --redact --max-decode-depth 3
      - name: Generate SBOMs
        run: |
          for service in setup topology playback bundle; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro aquasec/trivy:0.76.0 image --format cyclonedx "pb-acceptance-ci-$service" > "/tmp/$service-sbom.json"
          done
      - name: Retain reviewed image distribution and SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-images-and-sboms
          path: |
            /tmp/bridge-images.tar
            /tmp/bridge-bundle.tar
            /tmp/bundle-sbom.json
            /tmp/setup-sbom.json
            /tmp/topology-sbom.json
            /tmp/playback-sbom.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image && startsWith(github.ref, 'refs/tags/v') && github.repository == 'onelivewire/plex-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify release identity
        run: |
          version=$(python3 -c 'from plex_bridge import __version__; print(__version__)')
          test "$GITHUB_REF_NAME" = "v$version"
          echo "IMAGE=ghcr.io/$GITHUB_REPOSITORY:$version" >> "$GITHUB_ENV"
      - name: Download the tested and scanned bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name beta-images-and-sboms --dir /tmp/release
          docker load -i /tmp/release/bridge-bundle.tar
          docker tag pb-acceptance-ci-bundle "$IMAGE"
      - name: Publish exact tested image
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
          docker logout ghcr.io
      - name: Verify anonymous access and report digest
        run: |
          mkdir -p /tmp/anonymous-docker
          DOCKER_CONFIG=/tmp/anonymous-docker docker manifest inspect "$IMAGE" > /tmp/manifest.json
          DOCKER_CONFIG=/tmp/anonymous-docker docker pull "$IMAGE"
          docker run -d --name pb-registry-smoke --network none --read-only --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:size=16m,mode=1777 --mount type=volume,source=pb-registry-smoke-data,target=/data -e BRIDGE_HOST=127.0.0.1 "$IMAGE"
          for attempt in $(seq 1 45); do
            status=$(docker inspect pb-registry-smoke --format '{{.State.Health.Status}}')
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          test "$status" = healthy
          docker stop pb-registry-smoke
          echo '### Registry image' >> "$GITHUB_STEP_SUMMARY"
          echo "Published $IMAGE from the tested bundle artifact." >> "$GITHUB_STEP_SUMMARY"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}' >> "$GITHUB_STEP_SUMMARY"
